[project]
name = "zalo-datamate"
version = "0.1.0"
description = "Zalo AI Challenge 2026 — DataMate: Vietnamese NL question answering over tabular business data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-calamine>=0.9.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
