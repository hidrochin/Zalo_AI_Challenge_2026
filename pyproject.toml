[project]
name = "zalo-datamate"
version = "0.1.0"
description = "Zalo AI Challenge 2026 — DataMate: Vietnamese NL question answering over tabular business data"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "numpy>=2.4.6",
    "openai>=1.50",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-calamine>=0.9.0",
    "scikit-learn>=1.5",
    "tqdm>=4.70.1",
]

[project.scripts]
datamate = "datamate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamate"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
]
